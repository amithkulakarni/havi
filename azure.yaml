# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: havi-mcd-automation
metadata:
  template: azd-ai-agent-code

services:
  havi-deploy:
    project: .
    host: azure.ai.agent
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
      dependencyResolution: remote_build
